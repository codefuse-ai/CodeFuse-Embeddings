[project]
name = "f2llm"
version = "0.1.0"
description = "F2LLMs (Foundation-to-Feature Large Language Models) - foundation models directly finetuned on high-quality query-document pairs for embedding tasks"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "accelerate>=1.11.0",
    "datasets>=4.4.1",
    "deepspeed>=0.18.2",
    "torch>=2.9.1",
    "transformers>=4.57.1",
    "tensorboard>=2.20.0",
    "scikit-learn>=1.7.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3"
]

[project.optional-dependencies]
flash-attn = ["flash-attn>=2.8.3"]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "isort>=5.0.0"
]

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["F2LLM*", "CGE*"]
